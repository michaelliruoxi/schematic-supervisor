[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schematic-supervisor-companion"
version = "0.4.0"
description = "Local desktop companion for the deterministic schematic supervisor"
license = {text = "MIT"}
authors = [{name = "michaelliruoxi"}]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller==6.21.0"]

[project.scripts]
schematic-supervisor = "supervisor_companion.__main__:main"

[tool.setuptools]
packages = ["supervisor_companion"]
