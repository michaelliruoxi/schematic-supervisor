plugins {
    id "fabric-loom" version "${loom_version}"
    id "maven-publish"
    id "jacoco"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()

    maven {
        name = "Masa"
        url = "https://masa.dy.fi/maven/sakura-ryoko"
        content {
            includeGroupAndSubgroups("fi.dy.masa")
        }
    }

    ivy {
        name = "BaritoneGitHubReleases"
        url = "https://github.com/cabaletta/baritone/releases/download"
        patternLayout {
            artifact "v[revision]/[artifact]-[revision].[ext]"
        }
        metadataSources {
            artifact()
        }
        content {
            includeModule("baritone", "baritone-api-fabric")
        }
    }
}

configurations {
    automationMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    baritoneVerification {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    automationMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    automationMods "fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version}:${project.malilib_version}"
    automationMods "fi.dy.masa.litematica:litematica-fabric-${project.minecraft_version}:${project.litematica_version}"
    automationMods "baritone:baritone-api-fabric:${project.baritone_version}"
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation "fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version}:${project.malilib_version}"
    modImplementation "fi.dy.masa.litematica:litematica-fabric-${project.minecraft_version}:${project.litematica_version}"
    modImplementation "baritone:baritone-api-fabric:${project.baritone_version}"
    baritoneVerification "baritone:baritone-api-fabric:${project.baritone_version}"
    compileOnly "com.google.errorprone:error_prone_annotations:2.28.0"
    testCompileOnly "com.google.errorprone:error_prone_annotations:2.28.0"

    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.register("stageAutomationMods", Copy) {
    group = "distribution"
    description = "Stages the supervisor and its pinned mods for an automation profile."
    dependsOn tasks.remapJar, tasks.verifyBaritoneArtifact
    from configurations.automationMods
    from tasks.remapJar
    into layout.buildDirectory.dir("automation-mods")
}

tasks.register("verifyBaritoneArtifact") {
    group = "verification"
    description = "Verifies the official Baritone API Fabric release checksum."
    inputs.files(configurations.baritoneVerification)

    doLast {
        Set<File> artifacts = configurations.baritoneVerification.resolve()
        if (artifacts.size() != 1) {
            throw new GradleException("Expected one Baritone API artifact, received ${artifacts.size()}")
        }
        File artifact = artifacts.iterator().next()
        byte[] digest = java.security.MessageDigest.getInstance("SHA-256")
                .digest(artifact.bytes)
        String actual = java.util.HexFormat.of().formatHex(digest)
        String expected = "c58ef35a133b6ffce96a74682138ac2ee818cbc063b7c62671db9f9d7d783ebb"
        if (actual != expected) {
            throw new GradleException(
                    "Baritone API checksum mismatch for ${artifact.name}: expected ${expected}, received ${actual}"
            )
        }
    }
}

tasks.named("compileJava") {
    dependsOn tasks.named("verifyBaritoneArtifact")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "litematica_version", project.litematica_version
    inputs.property "malilib_version", project.malilib_version
    inputs.property "baritone_version", project.baritone_version

    filesMatching("fabric.mod.json") {
        expand(
            version: inputs.properties.version,
            minecraft_version: inputs.properties.minecraft_version,
            loader_version: inputs.properties.loader_version,
            litematica_version: inputs.properties.litematica_version,
            malilib_version: inputs.properties.malilib_version,
            baritone_version: inputs.properties.baritone_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
    options.compilerArgs.addAll(["-Xlint:all", "-Werror"])
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs "-Djava.awt.headless=true"
    testLogging {
        events "failed", "skipped"
        exceptionFormat = "full"
    }
    finalizedBy tasks.jacocoTestReport
}

jacoco {
    toolVersion = "0.8.13"
}

jacocoTestReport {
    dependsOn tasks.test
    reports {
        xml.required = true
        html.required = true
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
